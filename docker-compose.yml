# Starts the backend. Everything else in the project - the extension and the
# demo page - runs on the host, so Docker is convenient but never required.
#
#   docker compose up                       backend; MongoDB only if server/.env
#                                           sets MONGODB_URI (e.g. to Atlas)
#   docker compose --profile persistence up backend + a local MongoDB; set
#                                           MONGODB_URI=mongodb://mongo:27017/quiz-shop
services:
  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: ai-browser-assistant-server
    ports:
      - '3000:3000'
    env_file:
      - server/.env
    environment:
      # Production mode requires API_ACCESS_KEY in server/.env.
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3000'
      # Reach the host's demo page and the unpacked extension.
      CORS_ALLOWED_ORIGINS: 'chrome-extension://*,http://localhost:5173'
    restart: unless-stopped

  # A local MongoDB for the answer cache and question history, for when
  # Atlas is not wanted. Point the backend at it with
  # MONGODB_URI=mongodb://mongo:27017/quiz-shop in server/.env.
  mongo:
    image: mongo:7
    profiles:
      - persistence
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data:
